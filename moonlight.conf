## Moonlight Wii U Configuration
## Lines starting with '#' are comments, to edit an option uncomment it by removing the '#'
## Most of these can also be changed on the console: press X on the main screen
## to open the settings menu. Saving there updates this file.

## Hostname or IP-address of host to connect to
#address = 1.2.3.4

## Video streaming configuration
## 854x480 is the GamePad's native resolution and keeps 60 fps comfortable
#width = 854
#height = 480
#fps = 60

## Disables the gamepad so the other controllers are mapped to players 1 to 4
#disable_gamepad = false

## Swaps the buttons so they match the xbox controller layout (default: true)
#swap_buttons = true

## Automatically connect to the host on startup and start the stream
#autostream = false

## Changes the way touchscreen inputs are sent to the host
## relative - mouse behaves similarly to a touchpad
## absolute (default) - mouse moves to the exact touch position
## touchscreen - emulates touchscreen inputs on the host
#mouse_mode = absolute

## Output rotation (independent of xrandr or framebuffer settings!)
## Allowed values: 0, 90, 180, 270
#rotate = 0

## Bitrate in kbps. Set to -1 to pick automatically from resolution and fps.
## Default is 4096 (4 Mbps), which looks clean at 854x480 60 fps.
## Lower it if the stream breaks up on weak Wi-Fi.
#bitrate = 4096

## Size of network packets should be lower than MTU
## If streaming with WAN optimizations, this will be capped at 1024.
#packetsize = 1200

## Default started application on host
#app = Desktop

## Play audio on host instead of streaming to client
#localaudio = false

## Send quit app request to remote after quitting session
#quitappafter = false

## Disable all input processing (view-only mode)
#viewonly = false

## Enable QOS settings to optimize for internet or local network
## yes - optimize for WAN streaming
## no (default) - optimize for LAN streaming
## auto - decide automatically based on target IP address
#remote = no

## Enable 5.1/7.1 surround sound
#surround = 5.1
